# Deployment-trigger comment only (no config semantics changed): the
# Supabase GitHub integration for this project was connected after several
# migrations and supabase/functions/ai-analysis already existed on main, and
# a prior trigger commit that touched only docs/deployment-log.md (outside
# supabase/) did not produce a visible deployment. This comment is the
# smallest possible change actually inside supabase/ to test whether the
# integration requires a change under this directory specifically. See
# docs/deployment-log.md for the full history.
#
# Update: direct pushes to main did not trigger a deploy either (see
# docs/deployment-log.md). The Supabase GitHub App's own documentation
# states production migrations run automatically on PULL REQUEST MERGE, not
# on a direct push — so this comment-only change is carried on a dedicated
# branch (deploy-supabase-production) and opened as a PR into main, to test
# the PR-merge trigger specifically rather than a direct push.
project_id = "dkgjsobfljqoggalivzt"

[functions.ai-analysis]

# workspace-share serves public, unauthenticated share-link requests (see
# supabase/functions/workspace-share/index.ts) — its callers have no
# Supabase session at all, so the platform's own JWT check must be disabled
# for this function specifically. This does NOT weaken access control: the
# handler performs its own authorization in its place — it hashes the
# incoming share token, looks up the matching project_share_link row, and
# rejects (generic 404) unless that row exists, is not revoked, and is not
# past its expiry, before any project data is read. See that file's header
# comment and supabase/functions/workspace-share/handler.ts's own doc
# comment for the full design. No other function's configuration changes.
[functions.workspace-share]
verify_jwt = false
