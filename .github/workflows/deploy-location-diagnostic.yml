name: Deploy LOCATION diagnostic (temporary)

# TEMPORARY, MANUALLY-TRIGGERED ONLY — exists solely to deploy the
# short-lived LOCATION recall diagnostic instrumentation (commit a23fba3 on
# diagnostic-location-instrumentation) to the ai-analysis Edge Function for
# ONE real extraction run. Never fires automatically: no push/pull_request/
# schedule trigger. This workflow lives on main so it can commit here without
# ever moving diagnostic-location-instrumentation past a23fba3 — that branch
# must stay exactly there for the commit gate below to mean anything. Safe to
# delete once the diagnostic run has been captured and analyzed.

on:
  workflow_dispatch: {}

permissions:
  contents: read

run-name: "LOCATION diagnostic deploy (a23fba3) — triggered by ${{ github.actor }}"

jobs:
  deploy-location-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic-location-instrumentation
        uses: actions/checkout@v4
        with:
          ref: diagnostic-location-instrumentation

      - name: Verify checked-out commit is exactly a23fba3
        run: |
          set -euo pipefail
          EXPECTED="a23fba3"
          ACTUAL="$(git rev-parse HEAD | cut -c1-7)"
          echo "Expected commit: $EXPECTED"
          echo "Checked-out commit: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checked-out commit ($ACTUAL) does not match the required diagnostic commit ($EXPECTED). Aborting — refusing to deploy an unverified commit."
            exit 1
          fi
          echo "Verified: HEAD matches the required diagnostic commit."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Deploy ai-analysis Edge Function ONLY (API-based, no Docker)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy ai-analysis \
            --project-ref dkgjsobfljqoggalivzt \
            --use-api
