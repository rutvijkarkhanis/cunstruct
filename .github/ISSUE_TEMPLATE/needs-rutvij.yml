name: Decision needed (needs-rutvij)
description: Escalate a decision only Rutvij can make (PROTOCOL §7)
title: "DECISION NEEDED — "
labels: ["needs-rutvij"]
body:
  - type: markdown
    attributes:
      value: "Escalate only for: an action in PROTOCOL §8, a product or architecture decision the leads disagree on, a sensitive-data question, a production risk, or a disagreement two review rounds did not settle. Public repository — no secrets or client data."
  - type: textarea
    id: question
    attributes: { label: Question, description: "One sentence" }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: "Why it is Rutvij's", description: "Which PROTOCOL rule makes this his decision" }
    validations: { required: true }
  - type: textarea
    id: options
    attributes: { label: "Options and consequences", value: "A) \nB) \n" }
    validations: { required: true }
  - type: input
    id: default
    attributes: { label: "Default if no answer", placeholder: "Option A after <date>, or 'none — blocking'" }
    validations: { required: true }
  - type: input
    id: blocks
    attributes: { label: Blocks, placeholder: "#219" }
  - type: input
    id: agent
    attributes: { label: "Raised by (agent)", placeholder: "Codex" }
    validations: { required: true }
